services:
  db:
    networks:
      - e2e_network

  api-prepare:
    networks:
      - e2e_network
    environment: &e2e_api_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_LINK_TTL_SECONDS: ${TELEGRAM_LINK_TTL_SECONDS:-600}
      TELEGRAM_BOT_API_BASE_URL: ${TELEGRAM_BOT_API_BASE_URL}
      TELEGRAM_BOT_FILE_BASE_URL: ${TELEGRAM_BOT_FILE_BASE_URL}
      TELEGRAM_PUBLIC_BOT_BASE_URL: ${TELEGRAM_PUBLIC_BOT_BASE_URL}
      BINANCE_SPOT_BASE_URL: ${BINANCE_SPOT_BASE_URL}
      BINANCE_SPOT_WS_BASE_URL: ${BINANCE_SPOT_WS_BASE_URL}
      E2E_TEST_MODE: ${E2E_TEST_MODE}
      E2E_CLOCK_NOW: ${E2E_CLOCK_NOW}
      E2E_CONTROL_TOKEN: ${E2E_CONTROL_TOKEN}
      E2E_WORKER_GATE_ENABLED: ${E2E_WORKER_GATE_ENABLED}

  db-migrate:
    networks:
      - e2e_network
    environment:
      <<: *e2e_api_environment

  provider-simulator:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: services/e2e-provider-simulator/Dockerfile
    environment:
      E2E_CONTROL_TOKEN: ${E2E_CONTROL_TOKEN}
      E2E_CLOCK_NOW: ${E2E_CLOCK_NOW}
      E2E_WORKER_GATE_PATH: /e2e/worker-gates.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    networks:
      - e2e_network
    volumes:
      - e2e_state:/e2e

  market-catalog-init:
    networks:
      - e2e_network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      provider-simulator:
        condition: service_healthy
    environment:
      <<: *e2e_api_environment

  candle-bootstrap-init:
    profiles: ["local-bootstrap"]

  e2e-seed:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    command: uv run --frozen python -m freecoinalert_api.e2e.seed
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      market-catalog-init:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment
    init: true
    networks:
      - e2e_network
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv

  api:
    networks:
      e2e_network:
        aliases:
          - api.freecoinalert.test
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      e2e-seed:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment
      WEB_ORIGIN: ${E2E_WEB_ORIGIN}

  web:
    networks:
      e2e_network:
        aliases:
          - web.freecoinalert.test
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${E2E_API_ORIGIN}
    volumes:
      - web_next:/workspace/apps/web/.next
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s

  market-stream:
    networks:
      - e2e_network
    depends_on: !override
      e2e-seed:
        condition: service_completed_successfully
      provider-simulator:
        condition: service_healthy
    environment:
      <<: *e2e_api_environment
      MARKET_EVENT_MAX_AGE_SECONDS: ${MARKET_EVENT_MAX_AGE_SECONDS:-30}
      MARKET_EVENT_FUTURE_TOLERANCE_SECONDS: ${MARKET_EVENT_FUTURE_TOLERANCE_SECONDS:-5}
      MARKET_CATALOG_REFRESH_SECONDS: ${MARKET_CATALOG_REFRESH_SECONDS:-30}
      MARKET_STATE_WRITE_INTERVAL_SECONDS: ${MARKET_STATE_WRITE_INTERVAL_SECONDS:-1}
      MARKET_STREAM_RECONNECT_MAX_SECONDS: ${MARKET_STREAM_RECONNECT_MAX_SECONDS:-2}
      CANDLE_WS_MAX_AGE_SECONDS: ${CANDLE_WS_MAX_AGE_SECONDS:-30}
      CANDLE_DATA_MAX_LAG_SECONDS: ${CANDLE_DATA_MAX_LAG_SECONDS:-30}
      CANDLE_RECENT_RECONCILIATION_SECONDS: ${CANDLE_RECENT_RECONCILIATION_SECONDS:-30}
      CANDLE_RECENT_RECONCILIATION_HOURS: ${CANDLE_RECENT_RECONCILIATION_HOURS:-1}

  telegram-updates:
    networks:
      - e2e_network
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment

  notification-worker:
    networks:
      - e2e_network
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment

  signal-telegram-dispatcher:
    networks:
      - e2e_network
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment

  historical-analysis-worker:
    networks:
      - e2e_network
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment
      HISTORICAL_ANALYSIS_WORKER_POLL_SECONDS: ${HISTORICAL_ANALYSIS_WORKER_POLL_SECONDS:-0.25}
      HISTORICAL_ANALYSIS_WORKER_CLAIM_LIMIT: ${HISTORICAL_ANALYSIS_WORKER_CLAIM_LIMIT:-1}
      HISTORICAL_ANALYSIS_WORKER_STALE_SECONDS: ${HISTORICAL_ANALYSIS_WORKER_STALE_SECONDS:-60}
      E2E_WORKER_GATE_PATH: /e2e/worker-gates.json
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
      - e2e_state:/e2e

  e2e-control:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    command: uv run --frozen python -m freecoinalert_api.e2e.control
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    environment:
      <<: *e2e_api_environment
      E2E_WORKER_GATE_PATH: /e2e/worker-gates.json
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    init: true
    networks:
      - e2e_network
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
      - e2e_state:/e2e

  e2e-tests:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: apps/e2e/Dockerfile
    command: ["pnpm", "exec", "playwright", "test"]
    working_dir: /workspace/apps/e2e
    depends_on:
      provider-simulator:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      e2e-control:
        condition: service_healthy
    environment:
      E2E_CONTROL_TOKEN: ${E2E_CONTROL_TOKEN}
      E2E_RUN_ID: ${E2E_RUN_ID:-compose-run}
      E2E_API_ORIGIN: ${E2E_API_ORIGIN}
      E2E_WEB_ORIGIN: ${E2E_WEB_ORIGIN}
      E2E_ARTIFACT_DIR: /artifacts/e2e
    init: true
    ipc: host
    networks:
      - e2e_network
    ports:
      - "127.0.0.1:9323:9323"
    volumes:
      - ./artifacts/e2e:/artifacts/e2e

networks:
  e2e_network:
    name: freecoinalert-e2e-network

volumes:
  postgres_data:
    name: freecoinalert-e2e-postgres-data
  pnpm_store:
    name: freecoinalert-e2e-pnpm-store
  root_node_modules:
    name: freecoinalert-e2e-root-node-modules
  web_node_modules:
    name: freecoinalert-e2e-web-node-modules
  web_next:
    name: freecoinalert-e2e-web-next
  api_venv:
    name: freecoinalert-e2e-api-venv
  e2e_state:
    name: freecoinalert-e2e-state
