[project]
name = "freecoinalert-api"
version = "0.1.0"
description = "Backend API for the FreeCoinAlert platform."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.5",
    "email-validator==2.3.0",
    "fastapi[standard]==0.139.2",
    "pwdlib[argon2]==0.3.0",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["freecoinalert_api"]
