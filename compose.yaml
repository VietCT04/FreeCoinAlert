x-api-common: &api-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile.dev
  environment: &api-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  init: true
  volumes:
    - ./apps/api:/app
    - api_venv:/app/.venv

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    command:
      ["sh", "-c", "pnpm install --frozen-lockfile && pnpm --filter @freecoinalert/web dev --hostname 0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - pnpm_store:/pnpm/store

  api-prepare:
    <<: *api-common
    command: uv sync --frozen
    restart: "no"

  db-migrate:
    <<: *api-common
    command: uv run --frozen alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      api-prepare:
        condition: service_completed_successfully

  api:
    <<: *api-common
    command: uv run --frozen fastapi dev src/freecoinalert_api/main.py --host 0.0.0.0 --port 8000
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_LINK_TTL_SECONDS: ${TELEGRAM_LINK_TTL_SECONDS:-600}
      BINANCE_SPOT_BASE_URL: ${BINANCE_SPOT_BASE_URL:-https://api.binance.com}
      MARKET_CATALOG_MAX_AGE_SECONDS: ${MARKET_CATALOG_MAX_AGE_SECONDS:-86400}
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  telegram-updates:
    profiles: ["telegram"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.telegram.poller
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_UPDATE_RETENTION_DAYS: ${TELEGRAM_UPDATE_RETENTION_DAYS:-30}

  notification-worker:
    profiles: ["telegram"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.notifications.worker
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

  signal-telegram-dispatcher:
    profiles: ["telegram"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.notifications.signal_dispatcher
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      SIGNAL_TELEGRAM_FANOUT_BATCH_SIZE: ${SIGNAL_TELEGRAM_FANOUT_BATCH_SIZE:-100}
      SIGNAL_TELEGRAM_FANOUT_CLAIM_LIMIT: ${SIGNAL_TELEGRAM_FANOUT_CLAIM_LIMIT:-10}
      SIGNAL_TELEGRAM_FANOUT_POLL_SECONDS: ${SIGNAL_TELEGRAM_FANOUT_POLL_SECONDS:-2}
      SIGNAL_TELEGRAM_FANOUT_MAX_AGE_SECONDS: ${SIGNAL_TELEGRAM_FANOUT_MAX_AGE_SECONDS:-900}

  historical-analysis-worker:
    profiles: ["historical-analysis"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.historical_analysis.worker
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      HISTORICAL_ANALYSIS_WORKER_POLL_SECONDS: ${HISTORICAL_ANALYSIS_WORKER_POLL_SECONDS:-2}
      HISTORICAL_ANALYSIS_WORKER_CLAIM_LIMIT: ${HISTORICAL_ANALYSIS_WORKER_CLAIM_LIMIT:-1}
      HISTORICAL_ANALYSIS_WORKER_STALE_SECONDS: ${HISTORICAL_ANALYSIS_WORKER_STALE_SECONDS:-600}
      HISTORICAL_ANALYSIS_RETENTION_DAYS: ${HISTORICAL_ANALYSIS_RETENTION_DAYS:-30}
      HISTORICAL_ANALYSIS_CLEANUP_BATCH_SIZE: ${HISTORICAL_ANALYSIS_CLEANUP_BATCH_SIZE:-100}

  market-catalog-init:
    profiles: ["market"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.market_data.catalog_sync
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      BINANCE_SPOT_BASE_URL: ${BINANCE_SPOT_BASE_URL:-https://api.binance.com}

  candle-bootstrap-init:
    profiles: ["market"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.market_data.candles.bootstrap
    restart: "no"
    depends_on:
      market-catalog-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      BINANCE_SPOT_BASE_URL: ${BINANCE_SPOT_BASE_URL:-https://api.binance.com}
      CANDLE_BOOTSTRAP_DAYS: ${LOCAL_CANDLE_BOOTSTRAP_DAYS:-35}

  market-stream:
    profiles: ["market"]
    <<: *api-common
    command: uv run --frozen python -m freecoinalert_api.market_data.stream
    depends_on:
      candle-bootstrap-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      BINANCE_SPOT_BASE_URL: ${BINANCE_SPOT_BASE_URL:-https://api.binance.com}
      BINANCE_SPOT_WS_BASE_URL: ${BINANCE_SPOT_WS_BASE_URL:-wss://stream.binance.com:9443}
      MARKET_EVENT_MAX_AGE_SECONDS: ${MARKET_EVENT_MAX_AGE_SECONDS:-10}
      MARKET_EVENT_FUTURE_TOLERANCE_SECONDS: ${MARKET_EVENT_FUTURE_TOLERANCE_SECONDS:-2}
      MARKET_CATALOG_REFRESH_SECONDS: ${MARKET_CATALOG_REFRESH_SECONDS:-21600}
      MARKET_STATE_WRITE_INTERVAL_SECONDS: ${MARKET_STATE_WRITE_INTERVAL_SECONDS:-1}
      MARKET_STREAM_RECONNECT_MAX_SECONDS: ${MARKET_STREAM_RECONNECT_MAX_SECONDS:-30}
      CANDLE_RETENTION_DAYS: ${CANDLE_RETENTION_DAYS:-180}
      CANDLE_WS_MAX_AGE_SECONDS: ${CANDLE_WS_MAX_AGE_SECONDS:-180}
      CANDLE_DATA_MAX_LAG_SECONDS: ${CANDLE_DATA_MAX_LAG_SECONDS:-180}
      CANDLE_RECENT_RECONCILIATION_SECONDS: ${CANDLE_RECENT_RECONCILIATION_SECONDS:-900}
      CANDLE_RECENT_RECONCILIATION_HOURS: ${CANDLE_RECENT_RECONCILIATION_HOURS:-6}

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  pnpm_store:
  root_node_modules:
  web_node_modules:
  api_venv:
